server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: inventory-service

  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/stockpulse_inventory}
    username: ${INVENTORY_DB_USERNAME:inventory_service}
    password: ${INVENTORY_DB_PASSWORD:Inventory2026Secure}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

stockpulse:
  reservation:
    ttl-seconds: ${RESERVATION_TTL_SECONDS:300}
    expiry-scan-interval-ms: ${RESERVATION_EXPIRY_SCAN_INTERVAL_MS:10000}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  events:
    topic: inventory-events

logging:
  level:
    com.stockpulse.inventory: INFO
    org.hibernate.SQL: WARN
